version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates arrive as one grouped PR; majors (e.g.
    # typescript, eslint) get their own PRs for individual review.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # TypeScript majors break the lint toolchain: eslint-config-next bundles
    # typescript-eslint, which rejects TS 7 at import (ceiling <6.1.0).
    # Lift this once typescript-eslint supports TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps"
